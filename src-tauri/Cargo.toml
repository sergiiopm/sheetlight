[package]
name = "sheetlight"
version = "0.0.1"
description = "A lightweight, fast local spreadsheet app"
authors = ["sergiiopm"]
license = "MIT"
repository = "https://github.com/sergiiopm/sheetlight"
edition = "2021"

[lib]
name = "sheetlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Formula engine, pinned to IronCalc main (see docs/spikes/ironcalc-engine.md).
ironcalc = { git = "https://github.com/ironcalc/IronCalc", rev = "341ec870afa5c898479ca92ab03800cf86dee2f1" }
ironcalc_base = { git = "https://github.com/ironcalc/IronCalc", rev = "341ec870afa5c898479ca92ab03800cf86dee2f1" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package]
name = "sheetlight"
version = "0.0.1"
description = "A lightweight, fast local spreadsheet app"
authors = ["sergiiopm"]
license = "MIT"
repository = "https://github.com/sergiiopm/sheetlight"
edition = "2021"

[lib]
name = "sheetlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Formula engine, pinned to IronCalc main (see docs/spikes/ironcalc-engine.md).
ironcalc = { git = "https://github.com/ironcalc/IronCalc", rev = "341ec870afa5c898479ca92ab03800cf86dee2f1" }
ironcalc_base = { git = "https://github.com/ironcalc/IronCalc", rev = "341ec870afa5c898479ca92ab03800cf86dee2f1" }
# Files (WS3). zip: same version IronCalc already links (no size cost), used by
# the xlsx fidelity layer. calamine: legacy .xls import only (LTO strips its
# xlsx/ods readers). encoding_rs: CSV Windows-1252/UTF-16 decode+encode.
# memchr: SIMD byte scanning in the CSV parser and the package XML scanner.
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
calamine = { version = "0.36", default-features = false }
encoding_rs = "0.8"
memchr = "2"
# Engine actor replies (already in the tree through tauri / ironcalc).
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
